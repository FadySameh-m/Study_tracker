{% extends "layout.html" %}

{% block main %}

    <h1>Create Account</h1>

    <form action="/register" method="post">

        <div>
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                required
            >
        </div>

        <div>
            <label for="confirmation">Confirm Password</label>
            <input
                id="confirmation"
                name="confirmation"
                type="password"
                required
            >
        </div>

        <button type="submit">Register</button>

    </form>

{% endblock %}
