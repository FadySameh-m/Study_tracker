{% extends "layout.html" %}

{% block main %}

    <h1>Log In</h1>

    <form action="/login" method="post">

        <div>
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                required
            >
        </div>

        <button type="submit">Log In</button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

{% endblock %}
